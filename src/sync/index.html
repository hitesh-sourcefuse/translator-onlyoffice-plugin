<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Cache</title>
    <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"></script>
    <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
    <link rel="stylesheet" href="styles/plugin.css">
</head>
<body>
    <div id="sync-container">
        <div class="sync-title">Sync Cache</div>
        <div id="sync-spinner" class="spinner"></div>
        <div id="sync-buttons-wrap" class="sync-buttons">
            <button id="btn-save-to-doc" class="btn-primary">Save to Doc</button>
            <button id="btn-load-from-doc">Load from Doc</button>
        </div>
        <div id="sync-status"></div>
    </div>

    <script src="scripts/sync.js"></script>
</body>
</html>
